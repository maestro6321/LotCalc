name: Build Flet App

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            build_cmd: flet build windows --yes
            artifact_path: build/windows
            needs_linux_deps: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checkout
        shell: pwsh
        run: |
          Write-Host "=== Git ==="
          git rev-parse HEAD
          git describe --tags --always

          Write-Host ""
          Write-Host "=== Project files ==="
          Get-ChildItem -Force
          Get-ChildItem src -Recurse

          Write-Host ""
          Write-Host "=== pyproject.toml ==="
          Get-Content pyproject.toml

          Write-Host ""
          Write-Host "=== Icon ==="
          if (Test-Path "src/assets/icon.png") {
              $icon = Get-Item "src/assets/icon.png"
              Write-Host "FOUND: $($icon.FullName)"
              Write-Host "SIZE: $($icon.Length) bytes"
              Write-Host "SHA256:"
              (Get-FileHash "src/assets/icon.png" -Algorithm SHA256).Hash
          }
          else {
              Write-Error "src/assets/icon.png NOT FOUND"
              exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Write version file
        shell: bash
        run: |
          mkdir -p src/assets
          VERSION="${{ github.event.release.tag_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME:-dev}-${GITHUB_SHA::7}"
          fi
          printf '%s' "$VERSION" > src/assets/version.txt
          echo "Wrote version: $VERSION"

      - name: Build app
        run: |
          flet --version
          ${{ matrix.build_cmd }}

      - name: Create ZIP archive
        id: zip
        shell: bash
        run: |
          cd build/windows
          ZIP_NAME="LotCalc-${{ github.event.release.tag_name }}-windows.zip"
          powershell -Command "Compress-Archive -Path * -DestinationPath '$ZIP_NAME' -Force"
          echo "zip_path=build/windows/$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false